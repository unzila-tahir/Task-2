<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Welcome | Northstar</title>
    <link rel="stylesheet" href="style.css">
  
</head>
<body>
    <main class="auth-layout">
        <section class="welcome-panel" aria-label="Welcome">
            <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Northstar</div>
            <div class="welcome-copy"><p class="eyebrow">A clearer way forward</p><h1>Make room for what matters.</h1><p>Your workspace is ready when you are. Sign in or create an account to get started.</p></div>
            <div class="panel-note">Simple tools. Thoughtful work.</div>
        </section>
        <section class="form-panel" aria-label="Account access">
            <div class="form-content">
                <h2 id="form-title">Welcome back</h2>
                <p class="subtitle" id="form-subtitle">Sign in to continue to your workspace.</p>
                <div class="tabs" role="tablist" aria-label="Choose an account action">
                    <button class="tab" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="auth-form" data-mode="login">Sign in</button>
                    <button class="tab" id="signup-tab" type="button" role="tab" aria-selected="false" aria-controls="auth-form" data-mode="signup">Create account</button>
                </div>
                <form id="auth-form" novalidate>
                    <div class="field hidden" id="name-field"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" aria-describedby="name-error"><p class="field-error" id="name-error"></p></div>
                    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-error" required><p class="field-error" id="email-error"></p></div>
                    <div class="field"><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="password-error" required><button class="show-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><p class="field-error" id="password-error"></p></div>
                    <div class="field hidden" id="confirm-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" placeholder="Re-enter your password" aria-describedby="confirm-error"><p class="field-error" id="confirm-error"></p></div>
                    <div class="form-options" id="login-options"><label class="check-label"><input type="checkbox" name="remember"> Remember me</label><a href="#" id="forgot-link">Forgot password?</a></div>
                    <div class="form-options hidden" id="signup-options"><label class="check-label"><input type="checkbox" id="terms"> I agree to the <a href="#terms">terms</a></label></div>
                    <button class="submit-button" id="submit-button" type="submit">Sign in</button>
                    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
   
    <script src="index.js" type="module"></script>
</body>
</html>
